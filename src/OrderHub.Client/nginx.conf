# nginx config for the Blazor WebAssembly client.
# SPA fallback: any unknown path serves index.html so client-side routing works.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long cache for fingerprinted Blazor assets, no cache for index.html.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}