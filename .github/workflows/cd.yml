name: CD

on:
  push:
    branches: [main]

# Required for the built-in GHCR login.
permissions:
  contents: read
  packages: write

# One deployment at a time; never cancel a running deploy.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/orderhub-api
  CLIENT_IMAGE: ghcr.io/${{ github.repository }}/orderhub-client

jobs:
  build-test-publish:
    name: Build, Test & Publish Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore OrderHub.slnx

      - name: Build
        run: dotnet build OrderHub.slnx --no-restore --configuration Release

      # Deploy only a green build
      - name: Test
        run: dotnet test OrderHub.slnx --no-build --configuration Release --logger "trx" --results-directory test-results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cd-test-results
          path: test-results
          retention-days: 7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Buildx builder with the docker-container driver — required for the
      # GHA cache backend (cache-from/cache-to below).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.API_IMAGE }}
            ${{ env.CLIENT_IMAGE }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/OrderHub.Api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:latest,${{ env.API_IMAGE }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/OrderHub.Client/Dockerfile
          push: true
          tags: ${{ env.CLIENT_IMAGE }}:latest,${{ env.CLIENT_IMAGE }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max

  deploy-api:
    name: Deploy API to Azure App Service
    runs-on: ubuntu-latest
    needs: build-test-publish
    environment:
      name: production-api
      url: ${{ vars.API_URL }}
    steps:
      - name: Deploy container to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.API_IMAGE }}:${{ github.sha }}

  deploy-client:
    name: Deploy Client to Azure App Service
    runs-on: ubuntu-latest
    needs: build-test-publish
    environment:
      name: production-client
      url: ${{ vars.CLIENT_URL }}
    steps:
      - name: Deploy container to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_CLIENT_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_CLIENT_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.CLIENT_IMAGE }}:${{ github.sha }}
